# PRODUCCIÓN en el servidor de internet: `make prod` (ver docs/despliegue-produccion.md).
# Archivo aparte del banco de pruebas (infra/docker-compose.yml): aquí no hay Mailpit, simulador ni puertos de la base.
#   db          PostgreSQL 16, sin puertos publicados; clave obligatoria
#   migrar      alembic upgrade head y termina; api y worker-dian esperan a que acabe
#   api         FastAPI (solo la ve Caddy)
#   worker-dian la cola de envíos a la DIAN (ambiente según DIAN_AMBIENTE) y la entrega por correo. UNO solo: dos
#               workers de la misma cola se quitarían los trabajos. Se reinicia solo si se cae.
#   web         Caddy: HTTPS con certificado público (Let's Encrypt), la PWA y /api -> api
# Variables: el .env de la raíz (no se versiona). El certificado de firma vive en ESTACION_SECRETOS, fuera del repo.
name: estacion-prod

x-backend: &backend
  build: ./backend
  image: estacion-backend:prod
  restart: unless-stopped
  env_file: .env
  environment: &entorno-backend
    # La clave sale del .env; sin ella el compose no arranca (ver db).
    DATABASE_URL: postgresql://estacion:${POSTGRES_PASSWORD}@db:5432/estacion
    TZ: America/Bogota
  depends_on:
    migrar:
      condition: service_completed_successfully
  logging: &registros
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: estacion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: estacion
      TZ: America/Bogota
    # Sin `ports`: la base solo se alcanza desde la red interna del compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estacion -d estacion"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *registros

  migrar:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *entorno-backend
      # Solo Caddy llega a la API (no tiene `ports`): se acepta su X-Forwarded-For (límite de intentos por IP).
      ESTACION_PROXY_CONFIABLE: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker-dian:
    <<: *backend
    command: ["python", "-m", "estacion.worker", "--proveedor", "dian"]
    volumes:
      # Certificado .pfx de la empresa (DIAN_CERTIFICADO_RUTA=/secretos/<archivo>.pfx en el .env). Solo lectura.
      - ${ESTACION_SECRETOS:?defina ESTACION_SECRETOS en el .env (carpeta del certificado, fuera del repo)}:/secretos:ro

  web:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
      args:
        CADDYFILE: infra/caddy/Caddyfile.prod
    image: estacion-web:prod
    restart: unless-stopped
    environment:
      ESTACION_DOMINIO: ${ESTACION_DOMINIO:?defina ESTACION_DOMINIO en el .env}
      # Correo para Let's Encrypt (avisos de vencimiento). `internal` = CA local de Caddy, SOLO para probar el
      # compose en un equipo sin dominio.
      ESTACION_TLS: ${ESTACION_TLS:?defina ESTACION_TLS en el .env (correo para Let's Encrypt)}
    ports:
      - "${ESTACION_PUERTO_HTTP:-80}:80"
      - "${ESTACION_PUERTO_HTTPS:-443}:443"
    volumes:
      - caddy_data:/data   # certificados emitidos: borrarlo obliga a pedirlos de nuevo
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *registros

volumes:
  pgdata:
  caddy_data:
  caddy_config:
