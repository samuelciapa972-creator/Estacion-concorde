# Banco de pruebas local. `make up` levanta la base; las fases siguientes agregan `api` y `web`.
# El esquema lo crean las migraciones de Alembic: `make migrate` (lo hace `make up`).
# Nombre propio del proyecto: no reutiliza el volumen `estacion_pgdata` de versiones anteriores.
name: estacion-banco

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: estacion
      # Solo desarrollo local. Cualquier otro ambiente define su propia clave en el .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estacion}
      POSTGRES_DB: estacion
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estacion -d estacion"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
