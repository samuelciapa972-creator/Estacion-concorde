[project]
name = "estacion"
version = "0.1.0"
description = "Sistema propio de la estación de servicio (reemplazo de Nexus): despachos, facturación electrónica y reportes"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "lxml>=5.0", "openpyxl>=3.1", "sqlalchemy>=2.0", "alembic>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "lxml-stubs", "types-openpyxl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- calidad
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fórmulas de Excel: partirlas las hace ilegibles.
"src/estacion/reportes.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["estacion"]

[tool.mypy]
python_version = "3.12"
files = ["src/estacion"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# ---------------------------------------------------------------- pruebas
[tool.pytest.ini_options]
testpaths = ["tests", "src/estacion"]
addopts = "--doctest-modules -ra"
markers = ["bd: necesita PostgreSQL (ESTACION_TEST_DSN); `make test` la define con la base del compose"]
