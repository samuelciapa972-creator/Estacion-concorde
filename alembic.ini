# Migraciones del esquema. La cadena de conexión NO va aquí: sale de DATABASE_URL.
#   DATABASE_URL=postgresql://estacion:<clave>@localhost:5432/estacion .venv/bin/alembic upgrade head
[alembic]
script_location = %(here)s/migrations
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
